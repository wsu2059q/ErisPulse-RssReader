[project]
name = "ErisPulse-RssReader"
version = "1.1.1"
description = "RSS订阅器模块——在聊天中订阅任意RSS/Atom源，自动推送更新"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" } 
authors = [ { name = "wsu2059q", email = "wsu2059@qq.com" } ]
dependencies = [
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
]

[project.urls]
homepage = "https://github.com/ErisPulse/ErisPulse-RssReader"

[project.entry-points."erispulse.module"]
"RssReader" = "RssReader:Main"

[tool.setuptools.packages.find]
include = ["RssReader*"]
exclude = ["config*", "tests*"]